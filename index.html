<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>投资偏好测试｜20 题识别价值、成长、动量与风险倾向</title>
    <meta
      name="description"
      content="免费完成 20 题投资偏好测试，在浏览器本地识别价值、成长、动量、系统化、风险与期限倾向；无需登录，不上传答卷。"
    >
    <link rel="canonical" href="https://investment-preference.pages.dev/">
    <meta name="theme-color" content="#0f6f63">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:title" content="投资偏好测试｜六维投资风格画像">
    <meta
      property="og:description"
      content="20 题、六个维度、本地计分。无需登录，不上传答卷。"
    >
    <meta property="og:url" content="https://investment-preference.pages.dev/">
    <meta
      property="og:image"
      content="https://investment-preference.pages.dev/assets/investment-style-result.png"
    >
    <meta property="og:image:alt" content="投资偏好测试的六维结果页面">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="投资偏好测试｜六维投资风格画像">
    <meta
      name="twitter:description"
      content="20 题识别价值、成长、动量、系统化、风险与期限倾向。"
    >
    <meta
      name="twitter:image"
      content="https://investment-preference.pages.dev/assets/investment-style-result.png"
    >
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "投资偏好测试",
        "alternateName": "Investment Style Questionnaire",
        "url": "https://investment-preference.pages.dev/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "inLanguage": "zh-CN",
        "isAccessibleForFree": true,
        "description": "一个在浏览器本地完成计分的 20 题六维投资风格偏好测试。"
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-labelledby="app-title">
        <header class="workspace__header">
          <div>
            <p class="eyebrow">本地自测 · 不上传数据</p>
            <h1 id="app-title">投资偏好问卷</h1>
          </div>
          <div class="progress-panel" aria-label="答题进度">
            <span id="progressText">0 / 20</span>
            <div class="progress-track">
              <div id="progressBar" class="progress-bar"></div>
            </div>
          </div>
        </header>

        <div class="layout">
          <aside class="dimension-list" aria-label="量表维度">
            <h2>维度</h2>
            <ul id="dimensionList"></ul>
          </aside>

          <section id="questionnaire" class="question-panel" aria-live="polite">
            <div class="question-meta">
              <span id="questionGroup"></span>
              <span id="questionIndex"></span>
            </div>
            <h2 id="questionText"></h2>

            <fieldset class="scale" aria-labelledby="questionText">
              <legend class="sr-only">请选择同意程度</legend>
              <div id="scaleOptions" class="scale-options"></div>
              <div class="scale-labels" aria-hidden="true">
                <span>完全不同意</span>
                <span>完全同意</span>
              </div>
            </fieldset>

            <p id="questionHint" class="hint" role="status"></p>

            <div class="actions">
              <button id="prevButton" class="button button--secondary" type="button">上一题</button>
              <button id="nextButton" class="button" type="button">下一题</button>
            </div>
          </section>

          <section id="resultPanel" class="result-panel hidden" aria-live="polite">
            <div class="result-heading">
              <p class="eyebrow">测评结果</p>
              <h2 id="profileTitle"></h2>
              <p id="profileSummary"></p>
            </div>

            <div id="scoreList" class="score-list"></div>

            <div class="result-copy">
              <h3>偏好解读</h3>
              <p id="profileInsight"></p>
              <h3>行动提示</h3>
              <p id="profileAdvice"></p>
              <h3>风险提示</h3>
              <p>
                本结果仅用于投资偏好自测与投资者教育，不构成任何投资建议、资产推荐或收益承诺。
                实际投资决策应结合个人财务状况、风险承受能力与专业意见。
              </p>
            </div>

            <div class="actions">
              <button id="restartButton" class="button" type="button">重新测试</button>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
